<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location AR: динамические места</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <script src="script.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #status { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 10px;
      background: rgba(0,0,0,.6); color: #fff; font: 14px sans-serif; text-align: center; }
  </style>
</head>
<body>
  <div id="status">Определяю позицию…</div>
  <a-scene vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
           renderer="antialias: true; alpha: true">
    <!-- gpsMinDistance: скрывать места ближе 40 м, как советует статья -->
    <a-camera id="cam" gps-new-camera="gpsMinDistance: 40"></a-camera>
  </a-scene>
</body>
</html>
