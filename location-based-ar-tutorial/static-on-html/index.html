<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location AR: места только в HTML</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
  <a-scene vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
           renderer="antialias: true; alpha: true">
    <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

    <!-- ВАЖНО: замените координаты на точку рядом с вами (например, через latlong.net).
         Сейчас указано Колизеею в Риме, как в статье. -->
    <a-box gps-new-entity-place="latitude: 41.892590; longitude: 12.489820"
           material="color: red" scale="10 10 10"
           animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true">
    </a-box>

    <!-- Можно добавить ещё места: просто копируйте блок выше с другими координатами. -->
  </a-scene>
</body>
</html>
